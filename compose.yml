services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/scout.sqlite
    volumes:
      - scout-data:/app/data
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  scout-data:
